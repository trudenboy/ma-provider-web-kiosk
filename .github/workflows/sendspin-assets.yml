name: Sendspin assets
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: provider/sendspin/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: provider/sendspin
      - name: Verify generated assets
        run: npm run check
        working-directory: provider/sendspin
      - name: Verify browser module behavior
        run: npm test
        working-directory: provider/sendspin
